{# 分布ページ共通: 自分のアカウント行の表示チェック (登録アカウントが複数ある場合は切り替えセレクトを表示) #}
<div class="ranked-dist-mine-check form-checkbox-group"
     :class="{ 'ranked-dist-mine-check--disabled': !hasMainAccount }"
     x-cloak>
    <input type="checkbox"
           class="form-checkbox"
           id="distMineCheckbox"
           x-model="showMine"
           @click="handleMineCheck($event)">
    {% if player_account_options | length > 1 %}
    {% if lang == "en" %}<label for="distMineCheckbox" class="form-checkbox-label">Show</label>{% endif %}
    <select class="player-account-select ranked-dist-mine-check__select" x-model="selectedAccountTag" @change="onMineAccountChange()" aria-label="{% if lang == 'ja' %}プレイヤーアカウント{% else %}Player account{% endif %}">
        <template x-for="account in playerAccounts" :key="account.tag">
            <option :value="account.tag" x-text="account.name" :selected="account.tag === selectedAccountTag"></option>
        </template>
    </select>
    <label for="distMineCheckbox" class="form-checkbox-label">
        {% if lang == "ja" %}の値を表示{% else %}values{% endif %}<span x-show="showMine">{% if lang == "ja" %}（{% else %} ({% endif %}<button type="button"
                class="ranked-dist-mine-check__refresh"
                :class="{ 'is-refreshing': isRefreshing }"
                @click.stop.prevent="refreshMine()">{% if lang == "ja" %}更新...{% else %}Update...{% endif %}</button>{% if lang == "ja" %}）{% else %}){% endif %}</span>
    </label>
    {% else %}
    <label for="distMineCheckbox" class="form-checkbox-label">
        <span x-show="hasMainAccount && showMine">
            {% if lang == "ja" %}自分のメインアカウントの値を表示（{% else %}Show main account ({% endif %}<button type="button"
                    class="ranked-dist-mine-check__refresh"
                    :class="{ 'is-refreshing': isRefreshing }"
                    @click.stop.prevent="refreshMine()">{% if lang == "ja" %}更新...{% else %}Update...{% endif %}</button>{% if lang == "ja" %}）{% else %}){% endif %}
        </span>
        <span x-show="!hasMainAccount || !showMine">
            {% if lang == "ja" %}自分のメインアカウントの値を表示{% else %}Show main account{% endif %}
        </span>
    </label>
    {% endif %}
</div>
